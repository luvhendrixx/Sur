# Keep Wi-Fi links stable instead of letting the card enter NetworkManager's
# aggressive power-save mode (a common cause of drops that look like the
# connection was "suspended" around sleep).
#
# 2 = disabled, 3 = enabled, 0 = NetworkManager default.
# This applies to every Wi-Fi profile and does not change the radio state.
[connection]
wifi.powersave = 2
